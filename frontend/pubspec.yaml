name: ai_roleplay_chat
description: AI 角色扮演聊天工具
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  # 固定 2.2.2：新版 Android 实现依赖 jni 原生构建，本机构建环境不支持
  shared_preferences: 2.2.2
  intl: ^0.19.0
  # M1 语音：ASR 走自研 Android MethodChannel，TTS 用 flutter_tts
  flutter_tts: ^4.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# 新版 shared_preferences_android 依赖 jni 原生构建，本机构建环境不支持 CMake 产物写入
dependency_overrides:
  shared_preferences_android: 2.2.3

flutter:
  uses-material-design: true
