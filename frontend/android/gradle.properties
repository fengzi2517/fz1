org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Djava.net.preferIPv4Stack=true
# 系统默认 JDK 为 1.8/25，Gradle 8.13 需要 17~21，固定使用本机 JDK 21
org.gradle.java.home=D:/software/JDK
android.useAndroidX=true
# Kotlin 守护进程默认写 AppData\Local\kotlin，本机该目录不可写，改为进程内编译
kotlin.compiler.execution.strategy=in-process
# Windows + 中文路径下 Kotlin 增量缓存关闭会失败，关闭增量编译
kotlin.incremental=false
# 项目路径包含中文，跳过 AGP 的非 ASCII 路径检查
android.overridePathCheck=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
