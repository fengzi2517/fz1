name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Test (272 项，内存 SQLite + FakeLLM，不联网)
        run: python -m pytest tests/
      - name: Coverage
        run: |
          python -m coverage run --source=app -m pytest tests/
          python -m coverage report | tail -6
      - name: HTTP smoke (真 uvicorn + 假 OpenAI 端点)
        run: python smoke_http.py
      - name: Lint
        run: python -m ruff check app tests

  image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build -t roleplay-backend ./backend

  # Flutter 前端本轮零改动，故不进 CI；接登录页时再补 flutter analyze/test
